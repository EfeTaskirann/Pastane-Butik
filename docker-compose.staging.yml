# ===========================================
# docker-compose.staging.yml — Staging Environment
# ===========================================
# Amaç:
#   Production'a birebir benzer, ama izole stack. Veri `pastane_staging` DB'sinde
#   tutulur, APP_ENV=staging, APP_DEBUG=false. Loglara/metriğe ayrı volume.
#
# Kullanım:
#   cp .env.staging.example .env.staging
#   # değerleri doldur (DB password, METRICS_TOKEN, HEALTH_TOKEN, SENTRY_DSN)
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --build
#   docker compose -f docker-compose.staging.yml logs -f app
#
# Temizle:
#   docker compose -f docker-compose.staging.yml down -v
#
# Production ile fark:
#   - Port 8090 (prod: 8080)
#   - DB adı pastane_staging (prod: pastane)
#   - Ayrı volume prefix (pastane_staging-*)
#   - Healthcheck start-period daha kısa (hızlı feedback)
# ===========================================

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pastane:staging
    container_name: pastane-staging-app
    restart: unless-stopped
    ports:
      - "${STAGING_APP_PORT:-8090}:80"
    environment:
      - APP_ENV=staging
      - APP_DEBUG=false
      - APP_NAME=${APP_NAME:-Tatlı Düşler (Staging)}
      - APP_URL=${APP_URL:-http://staging.tatlidusler.local:8090}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-pastane_staging}
      - DB_USERNAME=${DB_USERNAME:-pastane_staging}
      - DB_PASSWORD=${DB_PASSWORD:-staging_secret}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=staging
      - SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE:-0.5}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - HEALTH_TOKEN=${HEALTH_TOKEN}
      - REDIS_HOST=redis
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
    volumes:
      - staging-uploads:/var/www/html/uploads
      - staging-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pastane-staging-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    image: mysql:8.0.36
    container_name: pastane-staging-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-pastane_staging}
      - MYSQL_USER=${DB_USERNAME:-pastane_staging}
      - MYSQL_PASSWORD=${DB_PASSWORD:-staging_secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-staging_root_secret}
    volumes:
      - staging-mysql:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Localhost'tan bağlanmak için (prod'da açılmaz, staging'de debugging için)
      - "${STAGING_DB_PORT:-33307}:3306"
    networks:
      - pastane-staging-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-staging_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.2-alpine
    container_name: pastane-staging-redis
    restart: unless-stopped
    ports:
      - "${STAGING_REDIS_PORT:-6380}:6379"
    volumes:
      - staging-redis:/data
    networks:
      - pastane-staging-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Prometheus (opsiyonel — staging'de metrik toplamak için)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: pastane-staging-prometheus
    restart: unless-stopped
    ports:
      - "${STAGING_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus-staging.yml:/etc/prometheus/prometheus.yml:ro
      - staging-prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - pastane-staging-net
    profiles:
      - observability

volumes:
  staging-mysql:
    driver: local
  staging-redis:
    driver: local
  staging-uploads:
    driver: local
  staging-storage:
    driver: local
  staging-prometheus:
    driver: local

networks:
  pastane-staging-net:
    driver: bridge
